# Configuración global de radiografia.
# Las conexiones (URLs, organización) y los tokens no van aquí: viven en .env (ver .env.example).

version: 1

arquitectura:
  # Repositorios git donde arquitectura publica sus documentos (GitLab, GitHub o una carpeta local).
  # Se administran con /actualizar fuentes. /actualizar los copia en arquitectura/decisiones/<id>/ o
  # arquitectura/estandares/<id>/ y registra el commit en arquitectura/estado/fuentes.lock.
  #
  # Campos de cada fuente:
  #   id: decision-records          nombre de la carpeta dentro de arquitectura/decisiones/ o estandares/
  #   url: git@gitlab.com:grupo/proyecto.git   URL de git o ruta local
  #   ref: main                     rama o tag a seguir
  #   ruta: docs/adrs               carpeta dentro del repositorio
  #   tipo: adr                     adr | estandar | referencia
  #   estado_por_defecto: vigente   opcional: vigencia de los documentos sin sección "Estado"
  #                                 (útil para estándares); sin este campo son NO DETERMINADO
  fuentes: []

  # Cómo se interpreta la sección "Estado" de cada documento.
  # Un valor que no aparezca en estas listas se reporta como NO DETERMINADO.
  estados:
    vigente: [Aprobado]
    pendiente: [Propuesto, En revisión]
    no_vigente: [Reemplazado, Deprecado, Rechazado, Obsoleto]

calibracion:
  # Una fuente (ADR, criterio o regla de Sonar) es confiable cuando tiene al menos `minimo_triados`
  # hallazgos con decisión y su tasa de falsos positivos es menor que el máximo; si no, es ruidosa.
  minimo_triados: 5
  maximo_falsos_positivos: 0.20

jira:
  # Valores para crear Tareas, Spikes, Errores y Hotfix (ADR-EQ-009). La conexión va en .env.
  equipos: Back                  # valor del campo Equipos
  campo_equipos: Equipos         # nombre del campo en Jira
  campo_tipo: Tipo               # nombre del campo en Jira (Deuda Técnica, Deuda Operativa, Bau/Incidentes, Spike)
  tipos_incidencia:              # nombre del tipo de incidencia en Jira
    tarea: Tarea
    spike: Spike
    error: Error
    hotfix: Hotfix
  campo_medicion: Medición HU    # campo con la medición de calidad de la historia (se llena a mano)
  medicion_aceptada: [Óptima, Completa, Adecuada]   # valores con los que el harness toma una historia
